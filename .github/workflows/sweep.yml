name: sweep
# Every hour: take in what was left at the site's own door, re-read every line in the work against today's
# rules, hide what someone asked to have removed, and tell the stewards if anything needs a person.
# If GitHub has paused this schedule for inactivity, any steward can run it by hand (Actions > sweep > Run workflow);
# the outside clock (below) switches it on again by itself.
on:
  schedule:
    # The second clock. The first one is outside GitHub: once an hour a small scheduled function (tools/sweep_clock.js,
    # in the author's Cloudflare account) starts this workflow through workflow_dispatch, and that runs within seconds.
    # GitHub itself runs scheduled jobs when it has room and drops most of them on a quiet repository: with two chances
    # an hour (14 to 17 November 2026) a sweep ran only every two to seven hours, with six chances (17 November) once in
    # seven hours. The six chances stay for the day the outside clock stops. A sweep that finds nothing changes nothing
    # and takes ten seconds. The minutes are odd on purpose: the top of the hour and the round minutes are the most crowded.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: wingbeat-intake
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: door and sweep
        id: sweep
        run: python3 tools/wingbeat.py door
      - name: keep
        run: |
          git config user.name "the caption machine"
          git config user.email "actions@users.noreply.github.com"
          git add -A wingbeats themes people removals data feed.xml llms-full.txt
          git diff --cached --quiet || (git commit -m "sweep $(date -u +%FT%H:%MZ)" && (git push || (git pull --rebase && git push)))
      - name: tell the stewards
        if: steps.sweep.outputs.count != '0' && steps.sweep.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.sweep.outputs.notes }}
        run: |
          STEWARDS=$(python3 -c "import json;print(','.join(json.load(open('data/config.json'))['stewards']))")
          BODY=$(printf 'The hourly sweep needs a person to look at this.\n\n%s\n\nTo settle a removal request: `python3 tools/wingbeat.py resolve N removed` or `... resolve N restored`, then commit and push. Until then a thing that was hidden stays hidden, and a thing that was not hidden (a whole recording, or something a steward restored before) stays visible. See CHARTER.md, section 6 and Amendment 13.' "$NOTES")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "for the stewards, $(date -u +%F)" --body "$BODY" --assignee "$STEWARDS" || gh issue create --repo "$GITHUB_REPOSITORY" --title "for the stewards, $(date -u +%F)" --body "$BODY"
      - name: close what is settled
        # a stewards' issue closes by itself once every line in it that asked for a decision has one (tools/settled.py):
        # here for what was settled by hand (`resolve`), in wingbeat.yml right after a `confirm` or `deny`
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/settled.py
