name: wingbeat
# Turns an issue titled "wingbeat ..." into a mark in the work, an issue titled "remove <id>" or
# "take back <id>" into a removal, and a steward's issue titled "confirm p-name" / "deny p-name" into a settled claim. No third-party actions beyond checkout; no secrets beyond the built-in token.
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
concurrency:
  group: wingbeat-intake
  cancel-in-progress: false
jobs:
  intake:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' && (startsWith(github.event.issue.title, 'wingbeat') || startsWith(github.event.issue.title, 'remove ') || startsWith(github.event.issue.title, 'take back ') || startsWith(github.event.issue.title, 'confirm ') || startsWith(github.event.issue.title, 'deny ') || startsWith(github.event.issue.title, 'unclaim ')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: read it
        id: intake
        run: python3 tools/wingbeat.py intake
      - name: keep it
        if: steps.intake.outputs.accepted == 'yes'
        run: |
          git config user.name "the caption machine"
          git config user.email "actions@users.noreply.github.com"
          git add -A wingbeats themes people removals data feed.xml
          git commit -m "${{ steps.intake.outputs.id }}"
          git push || (git pull --rebase && git push)
      - name: answer
        if: steps.intake.outputs.accepted != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.intake.outputs.message }}
          ACCEPTED: ${{ steps.intake.outputs.accepted }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          if [ "$ACCEPTED" = "yes" ]; then gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed; fi
