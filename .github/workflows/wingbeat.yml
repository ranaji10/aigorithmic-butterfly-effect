name: wingbeat
# Turns an issue titled "wingbeat ..." into one line of the work.
# No third-party actions beyond checkout; no secrets beyond the built-in token.
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
concurrency:
  group: wingbeat-intake
  cancel-in-progress: false
jobs:
  intake:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.issue.title, 'wingbeat') && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read the line
        id: intake
        run: python3 tools/wingbeat.py intake
      - name: keep it
        if: steps.intake.outputs.accepted == 'yes'
        run: |
          git config user.name "the caption machine"
          git config user.email "actions@users.noreply.github.com"
          git add wingbeats data feed.xml
          git commit -m "wingbeat ${{ steps.intake.outputs.id }}"
          git push || (git pull --rebase && git push)
      - name: answer
        if: steps.intake.outputs.accepted != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.intake.outputs.message }}
          ACCEPTED: ${{ steps.intake.outputs.accepted }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          if [ "$ACCEPTED" = "yes" ]; then gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed; fi
