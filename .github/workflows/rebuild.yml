name: rebuild
# Rebuilds the indexes when a steward edits the work by hand (a tombstone, a theme, a person, a release from review).
on:
  push:
    branches: [main]
    paths: ['wingbeats/**', 'themes/**', 'people/**', 'removals/**', 'data/seeds-2021.json', 'data/archive.json', 'data/config.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wingbeat-intake
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/wingbeat.py build
      - run: |
          git config user.name "the caption machine"
          git config user.email "actions@users.noreply.github.com"
          git add data feed.xml
          git diff --cached --quiet || (git commit -m "rebuild index" && (git push || (git pull --rebase && git push)))
