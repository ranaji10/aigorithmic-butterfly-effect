name: rebuild
# Rebuilds the index when a steward edits or tombstones a wingbeat by hand, or merges a pull request.
on:
  push:
    branches: [main]
    paths: ['wingbeats/**', 'data/seeds-2021.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wingbeat-intake
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wingbeat.py build
      - run: |
          git config user.name "the caption machine"
          git config user.email "actions@users.noreply.github.com"
          git add data feed.xml
          git diff --cached --quiet || (git commit -m "rebuild index" && (git push || (git pull --rebase && git push)))
